server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: makerpixel-contabil-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/makerpixel_contabil}
    username: ${SPRING_DATASOURCE_USERNAME:makerpixel}
    password: ${SPRING_DATASOURCE_PASSWORD:makerpixel_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: America/Sao_Paulo
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

makerpixel:
  jwt:
    secret: ${JWT_SECRET:makerpixel-secret-token-key-super-secure-at-least-256-bits-length-tubarao-sc}
    expiration-hours: 12
  receita:
    brasil-api-url: https://brasilapi.com.br/api/cnpj/v1
    timeout-seconds: 12
    cache-ttl-hours: 24
  support-contact:
    whatsapp: "5548999999999"
    email: "mauriciogoulart.deoliveira37@gmail.com"

management:
  endpoints:
    web:
      exposure:
        include: health,info
