      var t = null;

      if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

<body>
  <div id="raiz">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060B13;color:#F0F4FA;font-family:'Geist',system-ui,sans-serif;padding:24px;text-align:center;">
      <div style="max-width:380px;width:100%;background:#0A1220;border:1px solid #1E2E48;border-radius:16px;padding:32px;box-shadow:0 8px 32px rgba(0,0,0,0.5);">
        <div style="width:48px;height:48px;border-radius:50%;background:rgba(0,229,255,0.1);color:#00E5FF;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;">✦</div>
        <h1 style="font-size:20px;font-weight:700;margin:0 0 8px;color:#00E5FF;">MakerPixel Techsystem</h1>
        <p style="font-size:14px;color:#879EBC;margin:0 0 20px;line-height:1.5;">Iniciando sistema...</p>
        <button id="btn-forcar-inicio" onclick="(function(){ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }).then(function(){ if('caches' in window){ return caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }); } }).finally(function(){ window.location.reload(true); }); } else { window.location.reload(true); } })()" style="display:none;width:100%;height:42px;background:#00E5FF;color:#040E1A;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Atualizar e Limpar Cache</button>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var b = document.getElementById("btn-forcar-inicio");
        if (b) b.style.display = "block";
      }, 2500);
    </script>
  </div>
