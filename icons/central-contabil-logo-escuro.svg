<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <linearGradient id="ccCyanGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="ccGlowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Container -->
  <rect x="10" y="10" width="120" height="120" rx="28" fill="#0A1628" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.9"/>
  <circle cx="70" cy="70" r="46" fill="#00A3E0" fill-opacity="0.12" />

  <!-- Stylized C & Pillars -->
  <path d="M 88 44 C 80 37, 62 37, 51 47 C 40 57, 40 83, 51 93 C 62 103, 80 103, 88 96" 
        fill="none" stroke="url(#ccCyanGradLogo)" stroke-width="8" stroke-linecap="round" filter="url(#ccGlowLogo)"/>
  
  <rect x="58" y="56" width="6.5" height="28" rx="3" fill="#38BDF8" />
  <rect x="68" y="49" width="6.5" height="35" rx="3" fill="url(#ccCyanGradLogo)" filter="url(#ccGlowLogo)" />
  <rect x="78" y="62" width="6.5" height="22" rx="3" fill="#0284C7" />
  <path d="M 54 89 H 88" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Typography -->
  <text x="146" y="68" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5px">CENTRAL <tspan fill="#00E5FF" filter="url(#ccGlowLogo)">CONTÁBIL</tspan></text>
  
  <!-- Subtitle Pill -->
  <rect x="148" y="86" width="176" height="26" rx="6" fill="#082138" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.8"/>
  <text x="158" y="104" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#00E5FF" letter-spacing="2.5px">GESTÃO &amp; FISCAL</text>
  <text x="336" y="104" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1px">PLATAFORMA SAAS</text>
</svg>
