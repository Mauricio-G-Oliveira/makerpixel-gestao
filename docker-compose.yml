services:
  postgres:
    image: postgres:16-alpine
    container_name: makerpixel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: makerpixel_contabil
      POSTGRES_USER: makerpixel
      POSTGRES_PASSWORD: makerpixel_secret
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makerpixel -d makerpixel_contabil"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: makerpixel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/makerpixel_contabil
      SPRING_DATASOURCE_USERNAME: makerpixel
      SPRING_DATASOURCE_PASSWORD: makerpixel_secret
      JWT_SECRET: makerpixel-secret-token-key-super-secure-at-least-256-bits-length-tubarao-sc
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

volumes:
  postgres_data:
