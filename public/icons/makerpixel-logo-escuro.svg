<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <linearGradient id="cyanGradD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0099DD"/>
    </linearGradient>
    <filter id="glowD" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Container -->
  <rect x="10" y="10" width="120" height="120" rx="28" fill="#0A1628" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.9"/>
  <circle cx="70" cy="70" r="48" fill="#00A3E0" fill-opacity="0.12" />

  <!-- Vertical Pixel Bars -->
  <rect x="36" y="52" width="14" height="40" rx="5" fill="#0284C7" />
  <rect x="58" y="32" width="14" height="60" rx="5" fill="url(#cyanGradD)" filter="url(#glowD)" />
  <rect x="80" y="44" width="14" height="48" rx="5" fill="#38BDF8" />

  <!-- Pixel Box & Bus -->
  <rect x="36" y="100" width="22" height="22" rx="6" stroke="#00E5FF" stroke-width="3" fill="none" />
  <rect x="43" y="107" width="8" height="8" rx="2" fill="#00E5FF" />
  <path d="M68 111 H98" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="104" cy="111" r="4.5" fill="#38BDF8" />

  <!-- Typography -->
  <text x="150" y="70" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5px">MAKER<tspan fill="#00E5FF" filter="url(#glowD)">PIXEL</tspan></text>
  
  <!-- Techsystem Subtitle Pill -->
  <rect x="152" y="86" width="166" height="26" rx="6" fill="#082138" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.8"/>
  <text x="162" y="104" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#00E5FF" letter-spacing="3.5px">TECHSYSTEM</text>
  <text x="332" y="104" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#94A3B8" letter-spacing="1px">GESTÃO FINANCEIRA</text>
</svg>
