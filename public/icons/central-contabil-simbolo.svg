<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ccBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B13"/>
      <stop offset="50%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#040D1A"/>
    </linearGradient>
    <linearGradient id="ccCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ccGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="ccGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#ccBgGrad)" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="8"/>

  <!-- Halo de fundo -->
  <circle cx="256" cy="256" r="170" fill="#00A3E0" fill-opacity="0.08" filter="url(#ccGlow)"/>

  <!-- Letra C estilizada (Central) em anel externo de precisão -->
  <path d="M 330 145 C 295 118, 220 118, 175 160 C 130 205, 130 307, 175 352 C 220 394, 295 394, 330 367" 
        fill="none" stroke="url(#ccCyanGrad)" stroke-width="32" stroke-linecap="round" filter="url(#ccGlow)"/>

  <!-- Pilares contábeis internos (Coluna e Balanço) -->
  <rect x="210" y="200" width="26" height="112" rx="13" fill="#38BDF8" fill-opacity="0.9"/>
  <rect x="250" y="172" width="26" height="140" rx="13" fill="url(#ccCyanGrad)" filter="url(#ccGlow)"/>
  <rect x="290" y="224" width="26" height="88" rx="13" fill="#0284C7" fill-opacity="0.85"/>

  <!-- Linha de base da balança / integração -->
  <path d="M 195 330 H 335" stroke="#00E5FF" stroke-width="10" stroke-linecap="round"/>

  <!-- Nó central de inteligência / ponto focal -->
  <circle cx="263" cy="142" r="12" fill="#00E5FF" filter="url(#ccGlow)"/>
  <circle cx="342" cy="256" r="10" fill="#38BDF8"/>
</svg>
