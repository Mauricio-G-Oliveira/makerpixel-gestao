<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B13"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0099DD"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="8"/>

  <!-- Glowing background cyber circle -->
  <circle cx="256" cy="256" r="180" fill="#00A3E0" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- ili Vertical Bars -->
  <!-- Left Bar -->
  <rect x="110" y="150" width="56" height="150" rx="18" fill="#0284C7" />
  
  <!-- Center Bar (Tallest) -->
  <rect x="194" y="80" width="56" height="220" rx="18" fill="url(#cyanGrad)" filter="url(#glow)"/>
  
  <!-- Right Bar -->
  <rect x="278" y="120" width="56" height="180" rx="18" fill="#38BDF8" />

  <!-- Bottom Pixel Box with Core Dot -->
  <rect x="110" y="325" width="86" height="86" rx="20" stroke="#00E5FF" stroke-width="14" fill="none" />
  <rect x="138" y="353" width="30" height="30" rx="8" fill="#00E5FF" />

  <!-- Data Bus Interconnect Line -->
  <path d="M220 368 H380" stroke="#00E5FF" stroke-width="14" stroke-linecap="round" />
  <circle cx="395" cy="368" r="16" fill="#38BDF8" />
</svg>
